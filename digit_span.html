<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Digit Span – Repetición Directa</title>
  <style>
    html {
      /* Base del tamaño de texto: 3vh = 3% de la altura de la ventana */
      font-size: 3vh;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: black;
      color: white;
      font-family: Arial, sans-serif;
      overflow: hidden;
      touch-action: manipulation;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    /* Contador de ensayos */
    #trialCounter {
      position: fixed;
      top: 1vh;
      right: 1vh;
      color: red;
      font-size: 1.2rem; /* 1.2 * 3vh */
      font-weight: bold;
      z-index: 1000;
    }
    #modal, #inputContainer, #summary {
      background: rgba(0,0,0,0.8);
      padding: 2rem;      /* 2 * 3vh */
      border-radius: 1rem;/* 1 * 3vh */
      text-align: center;
      max-width: 90vw;
    }
    /* Texto general */
    #modal p,
    #inputContainer p,
    #summary h2,
    #summary h3,
    label {
      font-size: 1rem; /* 1 * 3vh */
      line-height: 1.2;
    }
    /* Inputs más grandes */
    #modal input,
    #inputContainer input {
      margin: 0.5rem 0;
      padding: 0.8rem;       /* 0.8 * 3vh */
      font-size: 1.2rem;     /* 1.2 * 3vh */
      width: 80vw;
      text-align: center;
      border: none;
      border-radius: 0.5rem;
    }
    /* Botones más grandes */
    button {
      font-size: 1.2rem;     /* 1.2 * 3vh */
      padding: 0.8rem 1.5rem;/* 0.8 * 3vh, 1.5 * 3vh */
      margin-top: 1rem;
      border: none;
      border-radius: 0.5rem;
      background-color: #444;
      color: white;
    }
    #feedback {
      font-size: 1.2rem; /* 1.2 * 3vh */
      margin-top: 1rem;
      height: 1.4rem;
    }
    #summary {
      display: none;
      max-height: 90vh;
      overflow-y: auto;
    }
    #graph {
      margin-top: 1rem;
      background: white;
      padding: 1rem;
      border-radius: 0.5rem;
    }
  </style>
</head>
<body>

  <!-- Contador de ensayos -->
  <div id="trialCounter">Ensayo 0/14</div>

  <!-- Modal de inicio -->
  <div id="modal">
    <label>Nombre:<br><input id="nameInput" type="text" inputmode="text" pattern="[a-zA-Z ]*"></label><br>
    <label>Edad:<br><input id="ageInput" type="number" inputmode="numeric" pattern="[0-9]*"></label><br>
    <p>Este experimento se mostrará en pantalla completa.<br>Haz clic para comenzar.</p>
    <button onclick="startExperiment()">Comenzar experimento</button>
  </div>

  <!-- Contenedor para introducir respuesta -->
  <div id="inputContainer" style="display:none;">
    <p>Introduce la secuencia escuchada:</p>
    <input id="digitInput" type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off" autofocus>
    <button onclick="submitResponse()">Enviar</button>
  </div>

  <!-- Feedback (Correcto / Incorrecto) -->
  <div id="feedback"></div>

  <!-- Resumen final -->
  <div id="summary">
    <h2 id="thanksText"></h2>
    <h3 id="feedbackSpan"></h3>
    <button onclick="downloadCSV()">Descargar CSV</button>
    <div id="graph"></div>
  </div>

<script>
let maxTrials = 14;
let currentLength = 3;
let incorrectStreak = 0;
let trialCount = 0;
let sequence = [];
let results = [];
let participantName = '';
let participantAge = 0;
let trialStartTime = 0;

function startExperiment() {
  participantName = document.getElementById("nameInput").value || "Anon";
  participantAge = document.getElementById("ageInput").value || 0;
  document.getElementById("modal").style.display = "none";
  enterFullscreen().then(() => nextTrial());
}

function enterFullscreen() {
  const el = document.documentElement;
  const f = el.requestFullscreen || el.webkitRequestFullscreen || el.mozRequestFullScreen || el.msRequestFullscreen;
  return f ? f.call(el) : Promise.resolve();
}

function updateCounter() {
  document.getElementById("trialCounter")
          .textContent = `Ensayo ${trialCount}/${maxTrials}`;
}

function nextTrial() {
  document.getElementById("feedback").textContent = '';
  document.getElementById("inputContainer").style.display = 'none';
  sequence = generateSequence(currentLength);
  trialCount++;
  updateCounter();
  speakSequence(sequence, () => {
    trialStartTime = Date.now();
    document.getElementById("inputContainer").style.display = 'block';
    document.getElementById("digitInput").value = '';
    document.getElementById("digitInput").focus();
  });
}

function generateSequence(length) {
  const counts = {};
  const seq = [];
  while (seq.length < length) {
    const digit = Math.floor(Math.random() * 10);
    const last = seq[seq.length - 1];
    const allowRepeat = length >= 8;
    const c = counts[digit] || 0;
    if (digit !== last && (allowRepeat ? c < 2 : c < 1)) {
      seq.push(digit);
      counts[digit] = c + 1;
    }
  }
  return seq;
}

function speakSequence(seq, callback) {
  const synth = window.speechSynthesis;
  seq.forEach((d, i) => {
    const utter = new SpeechSynthesisUtterance(d.toString());
    utter.rate = 1;
    setTimeout(() => synth.speak(utter), i * 1000 + 500);
  });
  setTimeout(callback, seq.length * 1000 + 500);
}

function submitResponse() {
  const responseTime = Date.now() - trialStartTime;
  const input = document.getElementById("digitInput").value.trim();
  document.getElementById("inputContainer").style.display = 'none';
  checkResponse(input, responseTime);
}

function checkResponse(response, responseTime) {
  const respDigits = response.split('').map(ch => parseInt(ch));
  const correctIO = respDigits.length === sequence.length && respDigits.every((d,i) => d === sequence[i]);
  const aciertos = sequence.reduce((sum, d, i) => sum + (respDigits[i] === d ? 1 : 0), 0);
  const acumulado = results.reduce((sum, r) => sum + r.aciertos, 0);

  results.push({
    name: participantName,
    age: participantAge,
    trial: trialCount,
    sequence: sequence.join(''),
    response: response,
    correct_io: correctIO ? 1 : 0,
    mean: 0,
    sd: 0,
    aciertos: aciertos,
    acumulado_aciertos: acumulado + aciertos,
    tiempo_respuesta: responseTime
  });

  document.getElementById("feedback").textContent = correctIO ? "¡Correcto!" : "Incorrecto";

  if (correctIO) {
    incorrectStreak = 0;
    currentLength++;
  } else {
    incorrectStreak++;
    if (incorrectStreak >= 2 && currentLength > 2) {
      currentLength--;
      incorrectStreak = 0;
    }
  }

  setTimeout(() => {
    document.getElementById("feedback").textContent = '';
    if (trialCount < maxTrials) nextTrial();
    else showSummary();
  }, 2000);
}

function downloadCSV() {
  const header = "nombre,edad,n_trial,secuencia,secuencia_introducida,correct_io,mean,sd,aciertos,acumulado_aciertos,tiempo_respuesta\n";
  const body = results.map(r =>
    `${r.name},${r.age},${r.trial},${r.sequence},${r.response},${r.correct_io},${r.mean},${r.sd},${r.aciertos},${r.acumulado_aciertos},${r.tiempo_respuesta}`
  ).join("\n");
  const blob = new Blob([header + body], { type: "text/csv" });
  const link = document.createElement("a");
  link.href = URL.createObjectURL(blob);
  link.download = "results.csv";
  link.click();
}

function logistic(x, a, b) {
  return 1 / (1 + Math.exp(-(a + b * x)));
}

function fitLogistic(data) {
  const grouped = {};
  data.forEach(r => {
    const len = r.sequence.length;
    if (!grouped[len]) grouped[len] = { correct: 0, total: 0 };
    grouped[len].total++;
    if (r.correct_io) grouped[len].correct++;
  });
  for (let len = 3; len <= 12; len++) {
    if (!grouped[len]) grouped[len] = { correct: 0, total: 1 };
  }
  const x = [], y = [];
  Object.keys(grouped).forEach(k => {
    x.push(+k);
    y.push(grouped[k].correct / grouped[k].total);
  });
  let a = 0, b = 1, lr = 0.001;
  for (let epoch = 0; epoch < 100000; epoch++) {
    let da = 0, db = 0;
    for (let i = 0; i < x.length; i++) {
      const p = logistic(x[i], a, b);
      const err = p - y[i];
      da += err;
      db += err * x[i];
    }
    a -= lr * da;
    b -= lr * db;
  }
  const cpd = -a / b;
  const sd = Math.PI / (b * Math.sqrt(3));
  return { cpd, sd, a, b, x, y };
}

function showGraphLogistic(a, b, x, y) {
  const canvas = document.createElement('canvas');
  canvas.width = 600;
  canvas.height = 400;
  const ctx = canvas.getContext("2d");
  ctx.clearRect(0, 0, 600, 400);
  ctx.strokeStyle = "#000"; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(50,350); ctx.lineTo(550,350);
  ctx.moveTo(50,50); ctx.lineTo(50,350); ctx.stroke();
  ctx.font = "14px Arial"; ctx.fillStyle="#000";
  ctx.fillText("Longitud de la secuencia", 200, 380);
  ctx.save(); ctx.translate(15,250); ctx.rotate(-Math.PI/2);
  ctx.fillText("Proporción de aciertos", 0,0); ctx.restore();
  for (let v=0; v<=1; v+=0.2) {
    const ypix = 350 - v*300;
    ctx.fillText(v.toFixed(1), 20, ypix+5);
    ctx.beginPath(); ctx.moveTo(45,ypix); ctx.lineTo(55,ypix); ctx.stroke();
  }
  for (let i=3; i<=12; i++) {
    const xpix = 50 + ((i-3)/9)*500;
    ctx.fillText(i, xpix-5, 365);
    ctx.beginPath(); ctx.moveTo(xpix,345); ctx.lineTo(xpix,355); ctx.stroke();
  }
  ctx.beginPath(); ctx.strokeStyle="blue"; ctx.lineWidth=2;
  for (let i=0; i<=100; i++) {
    const val = 3 + i*(9/100);
    const prob = logistic(val, a, b);
    const xpix = 50 + ((val-3)/9)*500;
    const ypix = 350 - prob*300;
    i===0 ? ctx.moveTo(xpix,ypix) : ctx.lineTo(xpix,ypix);
  }
  ctx.stroke();
  ctx.fillStyle="red";
  x.forEach((val,i) => {
    const xpix = 50 + ((val-3)/9)*500;
    const ypix = 350 - y[i]*300;
    ctx.beginPath(); ctx.arc(xpix, ypix, 4, 0, 2*Math.PI); ctx.fill();
  });
  return canvas;
}

function showSummary() {
  document.getElementById("summary").style.display = 'block';
  document.getElementById("thanksText").textContent = "Gracias por participar";
  const allCorrect = results.every(r => r.correct_io === 1);
  const fb = document.getElementById("feedbackSpan");
  if (allCorrect) {
    fb.textContent = "Has acertado todas las secuencias. No se puede estimar el punto de corte del 50%.";
    document.getElementById("graph").innerHTML = "<p style='text-align:center;'>No se puede generar gráfica.</p>";
    return;
  }
  const { cpd, sd, a, b, x, y } = fitLogistic(results);
  results.forEach(r => {
    r.mean = cpd.toFixed(2);
    r.sd = sd.toFixed(2);
  });
  fb.textContent = `Tu amplitud de dígitos estimada (50% de aciertos) es aproximadamente de: ${cpd.toFixed(2)}.`;
  const graph = showGraphLogistic(a, b, x, y);
  const gcont = document.getElementById("graph");
  gcont.innerHTML = '';
  gcont.appendChild(graph);
}
</script>
</body>
</html>
