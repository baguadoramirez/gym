<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Seguimiento del Fantasma</title>
  <style>
    html, body {
      margin: 0;
      overflow: hidden;
      background: #000;
      font-family: sans-serif;
      user-select: none;
      touch-action: none;
      overscroll-behavior: none;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      cursor: none;
    }
    #ui {
      position: absolute;
      top: 10px;
      left: 10px;
      background: white;
      color: black;
      padding: 20px;
      border-radius: 10px;
      font-size: 20px;
      z-index: 10;
    }
    #beta-label {
      position: fixed;
      bottom: 10px;
      right: 10px;
      background: red;
      color: white;
      font-weight: bold;
      padding: 5px 10px;
      border-radius: 5px;
      font-size: 16px;
      z-index: 1000;
      opacity: 0.8;
    }
  </style>
</head>
<body>
  <div id="ui">
    <label>ID: <input type="text" id="pid"></label><br>
    <label>Edad: <input type="number" id="edad"></label><br>
    <label>Sexo:
      <select id="sexo">
        <option>Masculino</option>
        <option>Femenino</option>
        <option>Otro</option>
      </select>
    </label><br><br>
    <button id="start-button">Comenzar</button>
    <div id="feedback" style="margin-top:20px; display:none;"></div>
  </div>

  <canvas id="game"></canvas>
  <div id="beta-label">BETA</div>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const startBtn = document.getElementById('start-button');
    const feedbackDiv = document.getElementById('feedback');

    const ghost = { x: 400, y: 300, angle: 0, radius: 100 };
    const mouse = { x: 0, y: 0 };
    const tol = ghost.radius;
    let errors = [];
    let blockStart = 0;
    let lastTimestamp = null;

    let visomotorDelayFrames = 0;
    const mouseBuffer = [];
    let returnToCenterFrames = 0;

    canvas.style.cursor = 'none';

    document.addEventListener('keydown', e => {
      if (e.key >= '0' && e.key <= '9') {
        visomotorDelayFrames = parseInt(e.key) * 2;
        console.log(`Retraso visomotor: ${visomotorDelayFrames} frames`);
      }
    });

    function updateMousePosition(x, y) {
      const rect = canvas.getBoundingClientRect();
      const pos = { x: x - rect.left, y: y - rect.top };
      mouseBuffer.push(pos);
      if (mouseBuffer.length > 100) mouseBuffer.shift();
    }

    canvas.addEventListener('mousemove', e => updateMousePosition(e.clientX, e.clientY));
    canvas.addEventListener('touchmove', e => {
      if (e.touches.length > 0) {
        updateMousePosition(e.touches[0].clientX, e.touches[0].clientY);
      }
    }, { passive: false });

    startBtn.onclick = () => {
      const id = document.getElementById('pid').value;
      const edad = document.getElementById('edad').value;
      if (!id || !edad) {
        alert("Por favor, completa los campos.");
        return;
      }
      document.getElementById('ui').style.display = 'none';
      startExperiment();
    };

    function startExperiment() {
      errors = [];
      ghost.x = canvas.width / 2;
      ghost.y = canvas.height / 2;
      blockStart = performance.now();
      lastTimestamp = null;
      requestAnimationFrame(update);
    }

    function drawGhost(color) {
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.arc(ghost.x, ghost.y, ghost.radius, 0, Math.PI * 2);
      ctx.fill();

      ctx.save();
      ctx.translate(ghost.x, ghost.y);
      ctx.rotate(Math.PI / 4);
      ctx.strokeStyle = 'black';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(-ghost.radius, 0);
      ctx.lineTo(ghost.radius, 0);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(0, -ghost.radius);
      ctx.lineTo(0, ghost.radius);
      ctx.stroke();
      ctx.restore();
    }

    function drawCursor(pos) {
      ctx.strokeStyle = 'cyan';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(pos.x - 15, pos.y);
      ctx.lineTo(pos.x + 15, pos.y);
      ctx.moveTo(pos.x, pos.y - 15);
      ctx.lineTo(pos.x, pos.y + 15);
      ctx.stroke();
    }

    function drawDelayCounter() {
      ctx.fillStyle = 'red';
      ctx.font = '20px sans-serif';
      ctx.textAlign = 'right';
      ctx.fillText(`Retraso: ${visomotorDelayFrames} frames`, canvas.width - 20, 30);
    }

    function distance(a, b) {
      return Math.sqrt((a.x - b.x) ** 2 + (a.y - b.y) ** 2);
    }

    function update(t) {
      if (!lastTimestamp) lastTimestamp = t;
      const dt = (t - lastTimestamp) / 1000;
      lastTimestamp = t;

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const centerX = canvas.width / 2;
      const centerY = canvas.height / 2;
      const maxDistX = canvas.width * 0.35;
      const maxDistY = canvas.height * 0.35;

      const dx = ghost.x - centerX;
      const dy = ghost.y - centerY;

      if (Math.abs(dx) > maxDistX || Math.abs(dy) > maxDistY) {
        returnToCenterFrames = 5;
      }

      if (returnToCenterFrames > 0) {
        returnToCenterFrames--;
        const angleToCenter = Math.atan2(centerY - ghost.y, centerX - ghost.x);
        ghost.angle = angleToCenter;
      } else {
        ghost.angle += (Math.random() - 0.5) * 0.5;
      }

      const speed = 150;
      ghost.x += Math.cos(ghost.angle) * speed * dt;
      ghost.y += Math.sin(ghost.angle) * speed * dt;

      ghost.x = Math.max(ghost.radius, Math.min(canvas.width - ghost.radius, ghost.x));
      ghost.y = Math.max(ghost.radius, Math.min(canvas.height - ghost.radius, ghost.y));

      const delayedMouse = mouseBuffer.length > visomotorDelayFrames
        ? mouseBuffer[mouseBuffer.length - 1 - visomotorDelayFrames]
        : mouse;

      const ex = delayedMouse.x - ghost.x;
      const ey = delayedMouse.y - ghost.y;
      const err = Math.sqrt(ex * ex + ey * ey);
      errors.push({ x: ex, y: ey });

      const inTol = err < tol;
      drawGhost(inTol ? 'red' : 'white');
      drawCursor(delayedMouse);
      drawDelayCounter();

      if (t - blockStart < 999999999999999) {
        requestAnimationFrame(update);
      } else {
        const avgErr = errors.reduce((acc, e) => acc + Math.sqrt(e.x ** 2 + e.y ** 2), 0) / errors.length;
        feedbackDiv.innerHTML = `Finalizado. Error medio: ${avgErr.toFixed(1)} px.`;
        feedbackDiv.style.display = 'block';
      }
    }

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }

    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);
  </script>
</body>
</html>
