,
  // ======= ADICIONES: EJERCICIOS BÁSICOS FALTANTES =======

  "Fondos en paralelas (Dips)": {
    grupo: "Pecho",
    musculo: "Pectoral/Tríceps",
    seccion: "Inferior (Enfoque en pecho)",
    hacer: "Sujeta las barras paralelas y suspéndete con los brazos extendidos. <b>Inclina el torso hacia adelante (aprox. 30°)</b> y abre ligeramente los codos hacia afuera. Baja hasta que sientas un estiramiento en el pecho y empuja hacia arriba sin bloquear codos.",
    noHacer: "<b>No mantengas el cuerpo totalmente vertical</b> si buscas trabajar pecho (eso enfoca más el tríceps). Evita balancear las piernas o encoger los hombros hacia las orejas.",
    trucos: "Imagina que intentas <b>'juntar las barras'</b> mientras subes. Mantén el mentón pegado al pecho para ayudar a mantener la inclinación del torso y proteger el cuello."
  },

  "Remo con mancuerna a una mano": {
    grupo: "Espalda",
    musculo: "Dorsal",
    seccion: "Lateral (Unilateral)",
    hacer: "Apoya una mano y rodilla en un banco, manteniendo la espalda paralela al suelo. <b>Tira de la mancuerna hacia la cadera</b>, llevando el codo hacia atrás y arriba. Mantén el torso estable sin rotar.",
    noHacer: "<b>No tires de la mancuerna hacia el pecho</b> (esto usa demasiado el bíceps). Evita rotar el tronco para subir el peso.",
    trucos: "Piensa en tu mano como un simple <b>'gancho'</b>. El movimiento real debe ser liderado por el codo. Imagina que quieres darle un codazo a alguien que está detrás de tu cadera."
  },

  "Plancha abdominal (Plank)": {
    grupo: "Core",
    musculo: "Abdomen",
    seccion: "Estabilidad (Antiextensión)",
    hacer: "Apoya los antebrazos y las puntas de los pies. Mantén el <b>cuerpo en línea recta</b> desde los talones hasta la cabeza. Contrae activamente el abdomen y los glúteos.",
    noHacer: "<b>No dejes que la cadera caiga</b> (puente hundido) ni que el glúteo suba demasiado. No contengas la respiración (apnea).",
    trucos: "Imagina que quieres <b>empujar el suelo lejos de ti</b> con los codos y, al mismo tiempo, intenta 'acercar' los codos hacia tus pies sin moverlos. Esto crea una tensión intra-abdominal brutal."
  },



