<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Corsi Blocks – Repetición Directa (Responsive)</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: black;
      color: white;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }
    #canvas {
      display: block;
      background-color: black;
    }
    #ui {
      position: absolute;
      top: 1vh;
      left: 1vw;
      font-size: 2vh;
    }
    #feedback {
      position: absolute;
      bottom: 2vh;
      width: 100%;
      text-align: center;
      font-size: 4vh;
    }
    #summary {
      white-space: pre-wrap;
      text-align: left;
      background: #222;
      padding: 1em;
      border-radius: 5px;
      max-height: 90vh;
      overflow-y: auto;
      display: none;
      width: 90vw;
      margin: 0 auto;
    }
    #graph {
      display: block;
      margin: 2vh auto;
      max-width: 80vw;
      height: auto;
      background-color: white;
      padding: 2vh;
      border-radius: 1vw;
    }
    button {
      font-size: 2vh;
    }
  </style>
</head>
<body>
<canvas id="canvas"></canvas>
<div id="ui">
  <p id="instructions">
    Elige tu idioma:
    <button onclick="setLanguage('es')">Español</button>
    <button onclick="setLanguage('en')">English</button>
  </p>
</div>
<div id="feedback"></div>
<div id="summary">
  <h2 id="thanksText"></h2>
  <h3 id="feedbackSpan"></h3>
  <button onclick="downloadCSV()">Descargar CSV</button>
  <div id="graph"></div>
</div>

<script>
  const canvas = document.getElementById("canvas");
  const ctx = canvas.getContext("2d");
  const summaryDiv = document.getElementById("summary");
  const feedbackDiv = document.getElementById("feedback");
  const instructions = document.getElementById("instructions");

  const blockPercents = [
    [0.125, 0.1667], [0.375, 0.1667], [0.625, 0.1667],
    [0.25,  0.4167], [0.5,   0.4167],
    [0.125, 0.6667], [0.375, 0.6667], [0.625, 0.6667],
    [0.375, 0.5]
  ];
  let blockSize;
  let blockPositions = [];

  const maxTrials = 14;
  let currentLength = 3;
  let incorrectStreak = 0;
  let trialCount = 0;
  let sequence = [];
  let clickedOrder = [];
  let results = [];
  let showingSequence = false;
  let acceptingInput = false;
  let language = 'es';
  let participantName = '';
  let participantAge = 0;

  const instructionsText = {
    es: "Bienvenido/a al test de Corsi Blocks. Memoriza la secuencia de bloques rojos y luego haz clic en ellos en el mismo orden. Presiona cualquier tecla para comenzar.",
    en: "Welcome to the Corsi Blocks test. Memorize the sequence of red blocks and then click on them in the same order. Press any key to begin."
  };
  const feedbackText = {
    correct: { es: "¡Correcto!", en: "Correct!" },
    incorrect: { es: "Incorrecto", en: "Incorrect" }
  };

  function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    blockSize = Math.min(canvas.width, canvas.height) * 0.1;
    blockPositions = blockPercents.map(([px, py]) => [
      px * canvas.width,
      py * canvas.height
    ]);
    if (!showingSequence && !acceptingInput && trialCount === 0) {
      drawBlocks();
    }
  }
  window.addEventListener("resize", resizeCanvas);
  resizeCanvas();

  document.addEventListener("keydown", () => {
    if (!showingSequence && !acceptingInput && trialCount < maxTrials) {
      instructions.style.display = "none";
      nextTrial();
    }
  });

  function setLanguage(lang) {
    language = lang;
    participantName = prompt(lang === 'es' ? "Introduce tu nombre:" : "Enter your name:");
    participantAge  = prompt(lang === 'es' ? "Introduce tu edad:"  : "Enter your age:");
    instructions.textContent = instructionsText[language];
  }

  canvas.addEventListener("mousedown", e => {
    if (!acceptingInput) return;
    const rect = canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const my = e.clientY - rect.top;
    for (let i = 0; i < blockPositions.length; i++) {
      const [x, y] = blockPositions[i];
      if (mx >= x && mx <= x + blockSize && my >= y && my <= y + blockSize) {
        clickedOrder.push(i);
        drawBlocks(clickedOrder);
        if (clickedOrder.length === sequence.length) checkResponse();
        break;
      }
    }
  });

  function nextTrial() {
    clickedOrder = [];
    sequence = generateSequence(currentLength);
    trialCount++;
    drawBlocks();
    setTimeout(() => showSequence(0), 500);
  }

  function generateSequence(length) {
    const indices = [];
    while (indices.length < length) {
      const index = Math.floor(Math.random() * blockPositions.length);
      if (!indices.includes(index)) indices.push(index);
    }
    return indices;
  }

  function showSequence(index) {
    document.body.style.cursor = "none";
    if (index >= sequence.length) {
      showingSequence = false;
      acceptingInput = true;
      drawBlocks();
      document.body.style.cursor = "auto";
      return;
    }
    showingSequence = true;
    drawBlocks();
    highlightBlock(sequence[index], "red");
    setTimeout(() => {
      drawBlocks();
      setTimeout(() => showSequence(index + 1), 300);
    }, 700);
  }

  function highlightBlock(index, color) {
    const [x, y] = blockPositions[index];
    ctx.fillStyle = color;
    ctx.fillRect(x, y, blockSize, blockSize);
    ctx.strokeStyle = "white";
    ctx.lineWidth = 2;
    ctx.strokeRect(x, y, blockSize, blockSize);
  }

  function drawBlocks(highlights = []) {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    blockPositions.forEach(([x, y], i) => {
      ctx.fillStyle = highlights.includes(i) ? "green" : "white";
      ctx.fillRect(x, y, blockSize, blockSize);
      ctx.strokeStyle = "black";
      ctx.lineWidth = 2;
      ctx.strokeRect(x, y, blockSize, blockSize);
    });
  }

  function checkResponse() {
    acceptingInput = false;
    const correct = clickedOrder.every((val, idx) => val === sequence[idx]);
    const numCorrect = clickedOrder.filter((val, idx) => val === sequence[idx]).length;
    const acumulado = results.reduce((acc, r) => acc + r.aciertos, 0);

    feedbackDiv.textContent = correct ? feedbackText.correct[language] : feedbackText.incorrect[language];
    feedbackDiv.style.display = "block";

    results.push({
      name: participantName,
      age: participantAge,
      trial: trialCount,
      sequence: sequence.join(""),
      response: clickedOrder.join(""),
      correct_io: correct ? 1 : 0,
      mean: 0,
      sd: 0,
      aciertos: numCorrect,
      acumulado_aciertos: acumulado + numCorrect
    });

    if (correct) {
      incorrectStreak = 0;
      currentLength++;
    } else {
      incorrectStreak++;
      if (incorrectStreak >= 2 && currentLength > 2) {
        currentLength--;
        incorrectStreak = 0;
      }
    }

    setTimeout(() => {
      feedbackDiv.style.display = "none";
      if (trialCount < maxTrials) {
        nextTrial();
      } else {
        showSummary();
      }
    }, 2000);
  }

  function sigmoid(x) {
    return 1 / (1 + Math.exp(-x));
  }

  function fitLogistic(data) {
    const grouped = {};
    data.forEach(r => {
      const len = r.sequence.length;
      if (!grouped[len]) grouped[len] = { correct: 0, total: 0 };
      grouped[len].total += 1;
      if (r.correct_io) grouped[len].correct += 1;
    });

    const x = [], y = [];
    for (let len in grouped) {
      x.push(parseFloat(len));
      y.push(grouped[len].correct / grouped[len].total);
    }

    let a = 0, b = 1, lr = 0.01;
    for (let epoch = 0; epoch < 1000; epoch++) {
      let da = 0, db = 0;
      for (let i = 0; i < x.length; i++) {
        const z = a + b * x[i];
        const p = sigmoid(z);
        const error = p - y[i];
        da += error;
        db += error * x[i];
      }
      a -= lr * da;
      b -= lr * db;
    }

    const cpd = -a / b;
    return { cpd, a, b, x, y };
  }

  
  function showGraphLogistic(a, b, x, y, lang) {
    const canvas = document.createElement('canvas');
    canvas.width = 600;
    canvas.height = 400;
    const ctx = canvas.getContext("2d");

    ctx.clearRect(0, 0, 600, 400);

    // Ejes
    ctx.strokeStyle = "#000";
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(50, 350);
    ctx.lineTo(550, 350); // Eje X
    ctx.moveTo(50, 50);
    ctx.lineTo(50, 350); // Eje Y
    ctx.stroke();

    ctx.fillStyle = "#000";
    ctx.font = "14px Arial";
    ctx.fillText(lang === 'es' ? "Número de bloques" : "Block span", 250, 380);
    ctx.save();
    ctx.translate(10, 250);
    ctx.rotate(-Math.PI / 2);
    ctx.fillText(lang === 'es' ? "Proporción de aciertos" : "Proportion correct", 0, 0);
    ctx.restore();

    // Ticks y etiquetas en Y
    for (let i = 0; i <= 1; i += 0.2) {
      const yPix = 350 - i * 300;
      ctx.fillText(i.toFixed(1), 20, yPix + 5);
      ctx.beginPath();
      ctx.moveTo(45, yPix);
      ctx.lineTo(55, yPix);
      ctx.stroke();
    }

    // Ticks y etiquetas en X
    for (let i = 2; i <= 9; i++) {
      const xPix = 50 + ((i - 2) / 7) * 500;
      ctx.fillText(i, xPix - 5, 365);
      ctx.beginPath();
      ctx.moveTo(xPix, 345);
      ctx.lineTo(xPix, 355);
      ctx.stroke();
    }

    // Curva logística
    ctx.beginPath();
    ctx.strokeStyle = "blue";
    ctx.lineWidth = 2;
    for (let i = 0; i <= 100; i++) {
      const val = 2 + i * (7 / 100); // De 2 a 9
      const prob = 1 / (1 + Math.exp(-(a + b * val)));
      const px = 50 + ((val - 2) / 7) * 500;
      const py = 350 - prob * 300;
      if (i === 0) ctx.moveTo(px, py);
      else ctx.lineTo(px, py);
    }
    ctx.stroke();

    // Puntos observados
    ctx.fillStyle = "red";
    x.forEach((val, i) => {
      const px = 50 + ((val - 2) / 7) * 500;
      const py = 350 - y[i] * 300;
      ctx.beginPath();
      ctx.arc(px, py, 4, 0, 2 * Math.PI);
      ctx.fill();
    });

    return canvas;
  }

  function downloadCSV() {
    const csvContent = "nombre,edad,n_trial,secuencia,secuencia introducida,correct_io,mean,sd,aciertos,acumulado_aciertos\n" +
      results.map(r => `${r.name},${r.age},${r.trial},${r.sequence},${r.response},${r.correct_io},${r.mean},${r.sd},${r.aciertos},${r.acumulado_aciertos}`).join("\n");
    const blob = new Blob([csvContent], { type: "text/csv" });
    const link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = "results.csv";
    link.click();
  }

  function showSummary() {
    canvas.style.display = "none";
    summaryDiv.classList.remove("hidden");
    summaryDiv.style.display = "block";
    document.getElementById("thanksText").textContent =
      language === 'es' ? 'Gracias por participar' : 'Thank you for participating';

    const allCorrect = results.every(r => r.correct_io === 1);
    const feedback = document.getElementById("feedbackSpan");

    if (allCorrect) {
      const maxSpan = Math.max(...results.map(r => r.sequence.length));
      const msg = language === 'es'
        ? `Has acertado todas las secuencias. Tu amplitud mínima estimada es ${maxSpan}, pero no se puede calcular un umbral del 50%.`
        : `You got all sequences right. Your minimum estimated span is ${maxSpan}, but a 50% threshold cannot be computed.`;
      feedback.textContent = msg;
      document.getElementById("graph").innerHTML = "<p style='text-align:center;'>No se puede generar gráfica.</p>";
      return;
    }

    const { cpd, a, b, x, y } = fitLogistic(results);
    results.forEach(r => {
      r.mean = cpd.toFixed(2);
      r.sd = 1;
    });

    const msg = language === 'es'
      ? `Tu amplitud de dígitos estimada (50% aciertos) es aproximadamente ${cpd.toFixed(2)}.`
      : `Your estimated digit span (50% correct) is approximately ${cpd.toFixed(2)}.`;
    feedback.textContent = msg;

    
    const graph = showGraphLogistic(a, b, x, y, language);
    const graphContainer = document.getElementById("graph");
    graphContainer.innerHTML = "";
    graphContainer.appendChild(graph);
    
  }
</script>
</body>
</html>
